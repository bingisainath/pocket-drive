name: CI

# Runs on every push and pull request. The home server deploys a commit on main only once every
# check here has passed (see the home-server repo's deploy script).
on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Same major version as the server that runs the app, and as the Dockerfile.
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend

  web:
    name: Web app build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.19.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Type-checks and builds exactly as the server does when deploying.
      - run: npm run build
        working-directory: frontend

  image:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Building is not enough: a missing runtime dependency only shows up when the thing runs, and
      # a broken HEIF decoder or ffmpeg would silently cost thumbnails and video streaming instead
      # of failing loudly. So boot the image and make it answer.
      - run: docker build -t pocket-drive:ci .
      - name: Boot the image and check it serves
        run: |
          set -euo pipefail
          # Generate the hash with the image's own code rather than duplicating the format here.
          HASH=$(docker run --rm pocket-drive:ci \
            node -e "import('./src/auth.js').then(m=>console.log(m.hashPassword('ci-smoke-test')))")
          docker run -d --name pd -p 3000:3000 \
            -e DATA_DIR=/tmp/data -e STORAGE_DIR=/tmp/files -e PASSWORD_HASH="$HASH" \
            pocket-drive:ci
          for i in $(seq 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health || true)" = 200 ] && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/api/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/list)" = 401
      - name: The tools the app shells out to must exist
        run: |
          docker run --rm pocket-drive:ci ffmpeg -version  > /dev/null
          docker run --rm pocket-drive:ci ffprobe -version > /dev/null
          docker run --rm pocket-drive:ci sh -c 'command -v heif-dec'
      - if: always()
        run: docker logs pd 2>&1 | tail -20 || true
