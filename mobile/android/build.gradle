buildscript {
    ext {
        buildToolsVersion = "36.1.0"
        minSdkVersion = 24
        // API 37 is not released: it exists only as android-CANARY, so it cannot be installed from
        // the stable channel, and Google Play rejects production apps compiled against a preview SDK.
        // Nothing here needs it - the newest API the app uses is user-initiated data-transfer jobs (34).
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.2.0"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
        // Processes google-services.json for Firebase Cloud Messaging (push notifications).
        classpath("com.google.gms:google-services:4.4.2")
    }
}

apply plugin: "com.facebook.react.rootproject"
